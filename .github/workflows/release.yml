# v로 시작하는 태그(예: v2.0.1)를 푸시하면 윈도우/맥 패키지와 업데이트용 jar 를 빌드해 GitHub 릴리스로 올린다.
# 앱은 시작할 때 최신 릴리스를 확인하고 "새 버전이 있습니다. 업데이트할까요?" 를 묻는다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test --console=plain

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: |
            build/release/MyPet-windows-x64.zip
            build/release/MyPet.jar

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package
        run: |
          chmod +x gradlew scripts/package-macos.sh
          ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: build/release/MyPet-macos-*.dmg

  release:
    needs: [windows, macos]
    # 맥 빌드 하나가 실패해도 윈도우 + 업데이트 jar 가 있으면 릴리스한다
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MY_PET $GITHUB_REF_NAME" \
            --generate-notes
