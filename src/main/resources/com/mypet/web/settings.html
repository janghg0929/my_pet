<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>비트 설정</title>
  <!--
    MY_PET 설정 창 화면. 디자인은 settings.css, 동작은 settings.js 를 고치면 된다.
    Java 와의 연결: settings.js 의 send(...) → Java, Java → window.bitUpdate(state)
  -->
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- 진한 제목 막대 -->
  <header class="titlebar">
    <button class="back" data-action="back" title="뒤로가기" hidden>◀</button>
    <canvas class="bit-icon" aria-hidden="true"></canvas>
    <h1 id="title">비트 설정</h1>
    <!-- 외형 설정 화면에서만 보이는 검색창 (외형 이름, 앱 이름으로 검색: 한글/영어) -->
    <input class="search" id="appearance-search" type="text" placeholder="외형·앱 검색" autocomplete="off" spellcheck="false" hidden>
  </header>

  <!-- 메인 -->
  <main class="view" data-view="main">
    <p class="subtitle">설정할 항목을 선택하세요</p>
    <button class="menu-row" data-go="appearance">
      <span class="menu-title">외형 설정</span>
      <span class="menu-desc">앱 따라 변신</span>
    </button>
    <button class="menu-row" data-go="color">
      <span class="menu-title">색깔 설정</span>
      <span class="menu-desc">몸 색 바꾸기</span>
    </button>
    <button class="menu-row" data-go="parts">
      <span class="menu-title">모습 꾸미기</span>
      <span class="menu-desc">팔·다리·눈 바꾸기</span>
    </button>
    <footer class="footer">
      <span class="version" id="version">v-</span>
      <span class="footer-buttons">
        <button class="btn btn-danger" data-action="quit">종료</button>
        <button class="btn btn-primary" data-action="close">닫기</button>
      </span>
    </footer>
  </main>

  <!-- 외형 설정 -->
  <main class="view" data-view="appearance" hidden>
    <p class="subtitle">앱을 쓸 때 비트의 모습이 바뀌어요</p>
    <!-- 외형 목록은 settings.js 의 APPEARANCES 로 만든다 (한 페이지에 5개) -->
    <!-- 높이는 외형 5개가 찼을 때로 고정: 결과가 적으면 위에서부터 채우고 아래는 비워 둔다 -->
    <section class="box option-list" id="appearance-list"></section>
    <nav class="pager" id="appearance-pager" aria-label="외형 목록 페이지"></nav>
    <p class="legend">자동: 그 앱을 쓸 때만 · 끔: 안 바뀜 · 항상 켬: 언제나</p>
    <p class="status" id="appearance-status"></p>
  </main>

  <!-- 모습 꾸미기 (parts-editor.js, 고급 = timeline-editor.js) -->
  <main class="view" data-view="parts" hidden>
    <!-- [일반] 모양·사진·움직임 / [고급] 영상 편집처럼 시간 막대에 키프레임 -->
    <div class="part-tabs level-tabs" id="parts-level">
      <button class="seg selected" data-level="basic">일반</button>
      <button class="seg" data-level="advanced">고급 · 시간 막대</button>
    </div>
    <section class="box parts-stage">
      <canvas id="parts-canvas" class="parts-canvas" aria-label="비트 모습 편집"></canvas>
      <span class="stage-hint" id="parts-subtitle">끌어서 옮기기 · 모서리 네모는 크기 · 위 동그라미는 회전</span>
    </section>
    <div class="part-tabs part-picker" id="parts-tabs"></div>
    <!-- 일반과 고급을 같은 자리에 겹쳐 둔다 (창 크기 그대로) -->
    <div class="parts-panels">
    <div id="parts-basic">
    <!-- 고른 부위의 [모양·사진] 또는 [움직임] 을 바꾼다 -->
    <div class="part-tabs mode-tabs" id="parts-mode">
      <button class="seg selected" data-mode="shape">모양·사진</button>
      <button class="seg" data-mode="motion">움직임</button>
    </div>
    <!-- 두 칸을 같은 자리에 겹쳐 두고 안 쓰는 쪽은 투명하게: 탭·상황을 바꿔도 창 크기가 그대로 -->
    <div class="parts-panels">
    <div id="parts-shape">
    <div class="part-tabs eye-tabs off" id="parts-eye-tabs"></div>
    <div class="part-fields">
      <label>X <input id="parts-x" type="number" step="1"></label>
      <label>Y <input id="parts-y" type="number" step="1"></label>
      <label>너비 <input id="parts-w" type="number" step="1" min="2"></label>
      <label>높이 <input id="parts-h" type="number" step="1" min="2"></label>
      <label>회전 <input id="parts-rotation" type="number" step="5" title="도 (시계 방향)"></label>
    </div>
    <div class="button-row">
      <button class="btn btn-primary" id="parts-photo">넣기: 몸통 사진</button>
      <button class="btn" id="parts-photo-remove">사진 빼기</button>
    </div>
    </div>
    <!-- 움직임: 상황(항상/쉴 때/걸을 때/공중/잡힐 때)마다 자세 + 반복 움직임 (parts-editor.js, bit.js 의 partTransform) -->
    <div id="parts-motion" class="off">
      <div class="part-tabs anim-states" id="anim-states"></div>
      <div class="part-fields anim-fields">
        <label>X 이동 <input id="anim-dx" type="number" step="1"></label>
        <label>Y 이동 <input id="anim-dy" type="number" step="1"></label>
        <label>회전 <input id="anim-rotation" type="number" step="5" title="도 (시계 방향)"></label>
        <label>중심 <select id="anim-pivot" title="돌리기·늘이기의 기준점"></select></label>
      </div>
      <div class="part-tabs motion-types" id="motion-types"></div>
      <div id="motion-settings">
        <div class="motion-sliders">
          <label>크기 <b id="motion-size-value">5</b><input id="motion-size" type="range" min="1" max="10" step="1"></label>
          <label>빠르기 <b id="motion-speed-value">5</b><input id="motion-speed" type="range" min="1" max="10" step="1"></label>
        </div>
        <label class="check" id="motion-alternate-row"><input type="checkbox" id="motion-alternate"> 반대쪽은 엇갈리게</label>
      </div>
    </div>
    </div>
    </div>
    <!-- 고급: 상황마다 시간 막대 하나, 부위마다 키프레임(◆) 줄 -->
    <div id="parts-advanced" class="off">
      <div class="part-tabs anim-states" id="tl-states"></div>
      <div class="tl-transport">
        <button class="btn btn-small" id="tl-play" title="재생 / 멈춤 (스페이스)">▶</button>
        <button class="btn btn-small" id="tl-add" title="지금 비트 모습을 이 시간 장면으로 저장 (Enter, 줄 두 번 누르기)">◆ 추가</button>
        <button class="btn btn-small btn-danger" id="tl-delete" title="이 시간 장면 빼기 (Delete)">◆ 빼기</button>
        <label class="tl-length" title="클립 길이 (최대 60초)"><input id="tl-duration" type="number" step="0.1" min="0.1" max="60">초</label>
        <label class="check" title="끝나면 처음부터 다시"><input type="checkbox" id="tl-loop"> 반복</label>
        <label class="check" title="그 상황이 끝났다가 다시 시작하면, 처음부터가 아니라 멈췄던 데서 이어서 (쉴 때 20초마다 같은 동작에)"><input type="checkbox" id="tl-continue"> 이어서</label>
        <button class="btn btn-small tl-photo" id="tl-photo">사진 넣기</button>
        <button class="btn btn-small" id="tl-photo-remove">사진 빼기</button>
      </div>
      <canvas id="tl-canvas" class="tl-canvas" aria-label="시간 막대"></canvas>
      <div class="part-fields tl-fields">
        <label>X 이동 <input id="tl-dx" type="number" step="1"></label>
        <label>Y 이동 <input id="tl-dy" type="number" step="1"></label>
        <label>회전 <input id="tl-rotation" type="number" step="5"></label>
        <label>가로 % <input id="tl-scaleX" type="number" step="5" min="10" max="400"></label>
        <label>세로 % <input id="tl-scaleY" type="number" step="5" min="10" max="400"></label>
        <label title="이 시간부터 부위 사진을 바꾸기 (다음 사진 키까지)">사진 <select id="tl-key-photo"></select></label>
        <label title="다음 키까지 천천히 시작해서 천천히 멈추기">부드럽게 <input id="tl-ease" type="checkbox"></label>
      </div>
    </div>
    </div>
    <div class="parts-options">
      <label class="check"><input type="checkbox" id="parts-symmetric"> 좌우 맞추기</label>
      <button class="btn btn-small" id="parts-reset">기본 비트로</button>
    </div>
    <div class="button-row">
      <button class="btn" data-action="saveLook">지금 모습 저장</button>
      <button class="btn" data-go="looks">저장한 모습 <span id="looks-count"></span></button>
    </div>
    <p class="status" id="parts-status"></p>
  </main>

  <!-- 저장한 모습 (모습 꾸미기에서 들어온다: 뒤로가기 = 모습 꾸미기) -->
  <main class="view" data-view="looks" hidden>
    <p class="subtitle">저장해 둔 모습으로 언제든 바꿀 수 있어요</p>
    <!-- 목록은 settings.js 의 renderLooks 로 만든다 (한 페이지에 5개, 높이 고정) -->
    <section class="box option-list" id="looks-list"></section>
    <nav class="pager" id="looks-pager" aria-label="저장한 모습 페이지"></nav>
    <div class="button-row single">
      <button class="btn btn-primary" data-action="saveLook">지금 모습 저장</button>
    </div>
    <p class="status" id="looks-status"></p>
  </main>

  <!-- 색깔 설정 -->
  <main class="view" data-view="color" hidden>
    <p class="subtitle">비트의 몸 색을 바꿀 수 있어요</p>
    <section class="box color-preview">
      <canvas class="bit-stage" aria-hidden="true"></canvas>
      <div class="hex" id="hex">#000000</div>
    </section>
    <div class="button-row">
      <button class="btn" data-action="defaultColor">기본 색</button>
      <button class="btn btn-primary" data-action="pickColor">직접 고르기</button>
    </div>
    <p class="status" id="color-status"></p>
  </main>

  <script src="bit.js"></script>
  <script src="parts-editor.js"></script>
  <script src="timeline-editor.js"></script>
  <script src="settings.js"></script>
</body>
</html>
